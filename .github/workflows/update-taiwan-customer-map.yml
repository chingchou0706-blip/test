name: Update Taiwan Customer Map
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Refresh anonymized customer locations
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
        run: python clickup-taiwan-map/scripts/sync_clickup.py
      - name: Commit safe public JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clickup-taiwan-map/customers.json
          git diff --cached --quiet || (git commit -m "Update anonymized customer map data" && git push)
